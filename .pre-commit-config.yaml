repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run --project backend mypy
        language: system
        pass_filenames: false
        files: ^backend/
      - id: eslint
        name: eslint
        entry: pnpm --dir frontend lint
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: tsc
        name: tsc
        entry: pnpm --dir frontend typecheck
        language: system
        pass_filenames: false
        files: ^frontend/
