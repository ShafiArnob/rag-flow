[project]
name = "flowbuilder-backend"
version = "0.1.0"
description = "FlowBuilder API and workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=25.1",
    "asyncpg>=0.30",
    "celery[redis]>=5.4",
    "cryptography>=50.0.2",
    "fastapi>=0.115",
    "httpcore>=1.0",
    "httpx>=0.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-sdk>=1.28",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.32",
]

[project.scripts]
flowbuilder = "app.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "TID"]

# Outbound requests go through the egress client, which refuses internal addresses (SSRF).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Send outbound requests through app.egress.client.EgressClient."
"httpcore".msg = "Send outbound requests through app.egress.client.EgressClient."
"requests".msg = "Send outbound requests through app.egress.client.EgressClient."
"urllib.request".msg = "Send outbound requests through app.egress.client.EgressClient."
"http.client".msg = "Send outbound requests through app.egress.client.EgressClient."
"aiohttp".msg = "Send outbound requests through app.egress.client.EgressClient."
"urllib3".msg = "Send outbound requests through app.egress.client.EgressClient."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "TID251"]
"src/app/egress/**" = ["TID251"]
# The readiness check probes MinIO on the compose network's private address, which the egress
# client rightly refuses.
"src/app/main.py" = ["TID251"]
"src/app/api/health.py" = ["TID251"]
# Implementations of httpcore's network interfaces, whose method signatures take a timeout.
"src/app/egress/pinned_network.py" = ["ASYNC109"]
"tests/support/fake_network.py" = ["ASYNC109"]

[tool.mypy]
strict = true
files = ["src", "tests", "migrations"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: needs Postgres (DATABASE_URL) and Redis (REDIS_URL), as infra/docker-compose.test.yml provides",
    "contract: node contract tests (added in P01_S08)",
]
