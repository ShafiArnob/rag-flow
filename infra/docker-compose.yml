name: flowbuilder

# Run from the repository root:
#   docker compose --env-file .env -f infra/docker-compose.yml up --build --wait

# Each process gets only the database role it needs: the superuser only in db-bootstrap, the owner
# only in migrate and rotate-keys, and the row-level-security-bound app role in api and worker.
x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+asyncpg://flowbuilder_app:${DATABASE_APP_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  REDIS_URL: redis://redis:6379/0
  OBJECT_STORAGE_HEALTH_URL: http://minio:9000/minio/health/ready
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # The image ships bash but no curl or grep; speak HTTP over bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/9000
          && printf 'GET /minio/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && read -r status_line <&3
          && [[ $$status_line == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    build: ./otel-collector
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:13133/"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the extensions and the owner and app roles. Idempotent, so it runs on every up.
  db-bootstrap:
    build: ../backend
    command: ["python", "-m", "app.database.bootstrap"]
    environment:
      BOOTSTRAP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      DATABASE_OWNER_PASSWORD: ${DATABASE_OWNER_PASSWORD:?}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?}
    depends_on:
      postgres: {condition: service_healthy}

  # One-shot: applies migrations as the owner, then moves the 12-month run-partition horizon forward.
  migrate:
    build: ../backend
    command: ["sh", "-c", "alembic upgrade head && exec python -m app.runs.partitions"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://flowbuilder_owner:${DATABASE_OWNER_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
    depends_on:
      db-bootstrap: {condition: service_completed_successfully}

  api:
    build: ../backend
    # Started from Docker Desktop without its dependencies, the api's role guard fails while postgres
    # is still starting; retry.
    restart: on-failure
    # Only the api and rotate-keys hold the master keys; the worker decrypts no secret yet.
    environment:
      <<: *backend-environment
      MASTER_KEYS: ${MASTER_KEYS:?see .env.example}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      otel-collector: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    build: ../backend
    command: celery -A app.worker.celery_app worker --loglevel=${LOG_LEVEL:-INFO}
    environment: *backend-environment
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 15s

  # One-shot, run on demand once every api instance holds the new key first in MASTER_KEYS:
  #   docker compose --env-file .env -f infra/docker-compose.yml run --build --rm rotate-keys
  # --build because `up --build` skips this profile, so run would otherwise reuse a stale image.
  # It re-wraps every data key under the first key, as the owner, whose policies on secrets let it
  # select and update any row in every workspace; its own queries touch only the key columns. It
  # holds the owner's credentials and every master key, so run it only for a rotation. Rerun it until
  # it reports 0 remain. docs/key-providers.md has the full runbook.
  rotate-keys:
    build: ../backend
    profiles: [maintenance]
    command: ["flowbuilder", "keys", "rotate"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://flowbuilder_owner:${DATABASE_OWNER_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      MASTER_KEYS: ${MASTER_KEYS:?see .env.example}
    depends_on:
      migrate: {condition: service_completed_successfully}

  frontend:
    build: ../frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  minio-data:
